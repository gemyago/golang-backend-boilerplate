name: Docker Images

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # types: [closed]

jobs:
  cleanup:
    name: Cleanup
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Cleanup Docker Images
        run: |
          echo env
          ./scripts/ghcr.py cleanup-versions --namespace "users/gemyago" --package golang-backend-boilerplate-jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
